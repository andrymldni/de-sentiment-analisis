# =====================================================================
# BRILink Sentiment Platform - full local stack
#
#   make up        bring everything up
#   make demo      one-shot: ingest -> validate -> score -> dbt -> dashboard
#
# Airflow UI  http://localhost:8080
# Metabase    http://localhost:3000
# =====================================================================

x-brilink-env: &brilink-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-false}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-brilinkdb}
  POSTGRES_USER: ${POSTGRES_USER:-brilink}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brilink}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_ENABLED: "true"
  INGEST_CONNECTORS: ${INGEST_CONNECTORS:-all}
  INGEST_KEYWORDS: ${INGEST_KEYWORDS:-brilink,agen brilink,agen bri,laku pandai bri}
  INGEST_SEED_FALLBACK: ${INGEST_SEED_FALLBACK:-true}
  INGEST_SEED_DOCUMENTS: ${INGEST_SEED_DOCUMENTS:-2400}
  SENTIMENT_ENGINE_MODE: ${SENTIMENT_ENGINE_MODE:-ensemble}
  SENTIMENT_ENABLE_TRANSFORMER: ${SENTIMENT_ENABLE_TRANSFORMER:-true}
  SENTIMENT_ENABLE_EMOTION: ${SENTIMENT_ENABLE_EMOTION:-true}
  SENTIMENT_MODEL_VERSION: ${SENTIMENT_MODEL_VERSION:-brilink-ensemble-v2.0.0}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  METABASE_URL: http://metabase:3000
  METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@brilink.local}
  METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-BrilinkDemo123!}
  HF_HOME: /opt/airflow/.cache/huggingface
  PYTHONPATH: /opt/airflow/src
  DBT_PROFILES_DIR: /opt/airflow/dbt/brilink
  TOKENIZERS_PARALLELISM: "false"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
    args:
      INSTALL_TORCH: ${INSTALL_TORCH:-true}
      PREFETCH_MODELS: ${PREFETCH_MODELS:-false}
  image: brilink/airflow:2.0.0
  # The image is built locally and never published to a registry. Without this,
  # `docker compose run` treats the tag as a Docker Hub repository and fails
  # with "pull access denied" instead of building it.
  pull_policy: build
  environment:
    <<: *brilink-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-brilink}:${POSTGRES_PASSWORD:-brilink}@postgres:5432/airflow_meta
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt/brilink:/opt/airflow/dbt/brilink
    - ./sql:/opt/airflow/sql
    - airflow_logs:/opt/airflow/logs
    - hf_cache:/opt/airflow/.cache/huggingface
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: brilink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brilink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brilink}
      POSTGRES_DB: ${POSTGRES_DB:-brilinkdb}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/002_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./scripts/init-extra-databases.sh:/docker-entrypoint-initdb.d/03_extra_dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brilink} -d ${POSTGRES_DB:-brilinkdb}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: brilink_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # -------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: brilink_airflow_init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname BRILink --lastname Analytics \
          --role Admin --email admin@brilink.local || true
        echo "Airflow initialised."

  airflow-webserver:
    <<: *airflow-common
    container_name: brilink_airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: brilink_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.50.21
    container_name: brilink_metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-brilink}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-brilink}
      MB_DB_HOST: postgres
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------
  # One-shot runner: executes the whole pipeline without Airflow.
  # Handy for CI and for `make demo`.
  # -------------------------------------------------------------------
  pipeline-runner:
    <<: *airflow-common
    container_name: brilink_pipeline_runner
    restart: "no"
    profiles: ["tools"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "==> 1/5 ingestion"
        python -m brilink.ingestion.run_ingestion --force
        echo "==> 2/5 data quality gate"
        python -m brilink.quality.validate --hours 168
        echo "==> 3/5 sentiment scoring"
        python -m brilink.nlp.run_sentiment
        echo "==> 4/5 dbt build"
        cd /opt/airflow/dbt/brilink && dbt run --profiles-dir . && dbt test --profiles-dir .
        echo "==> 5/5 metabase dashboard"
        cd /opt/airflow && python -m brilink.serving.metabase_provision
        echo "Pipeline complete."
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  airflow_logs:
  hf_cache:
